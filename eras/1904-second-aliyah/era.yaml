id: 1904-second-aliyah
title: "From Moshavot to Yishuv — the Second Aliyah"
start_date: "1904-01-01"
end_date: "1914-07-01"
max_turns: 126
model: "deepseek/deepseek-v4-flash"
goal: "Lead the Yishuv committee through the Second Aliyah (1904–1914). Turn scattered, fragile settlements into a connected, self-sustaining Hebrew community — before the era ends."
objectives:
  - "Strengthen the four foundation tracks: Settlement, Economy, Hebrew Life, Self-Organization."
  - "Keep the treasury solvent — never let funds sit at zero for six straight months."
  - "Keep at least two settlements viable (housing, water, and health above zero)."
  - "Raise public trust among workers, donors, and the settlement committees."
  - "Complete the Ahuzat Bayit urban project (the future Tel Aviv)."
