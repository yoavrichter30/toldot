schema_version: '1.0'
project: Toldot
meaning:
  human_required: Requires human judgment, visual inspection, licensing decision, or playtest.
  human_review_required: A stronger model may draft it, but a human must approve before dependent historical or
    architectural work is accepted.
  placeholder_allowed: The game may proceed with a placeholder; this task is needed for visual polish rather than
    simulation proof.
