    max_changed_lines: 250
    max_new_dependencies: 0
    max_production_files: 1
  read_first:
  - toldot_qwen9b_agents.yaml
  - toldot_project.yaml
  objective: Create the single authoritative instruction file used by all coding agents.
  exact_instructions:
  - Copy the global execution rules from toldot_agents.yaml into concise imperative language.
  - 'Document the layer boundaries: simulation, app, presentation, content, tools, tests.'
  - State that one task ID is executed per branch or worktree.
  - State the required handoff fields and validation evidence.
  - 'State the forbidden operations: broad refactors, new dependencies, direct UI mutation, uncontrolled randomness.'
  required_api_or_shapes: []
  tests_or_checks_to_add:
  - Do not add tests unless an allowed test file is listed.
  - Do not weaken, delete, skip, or rewrite an existing test to make the task pass.
  acceptance_criteria:
  - AGENTS.md names every source directory and its allowed dependency direction.
  - AGENTS.md contains a one-task-at-a-time rule.
  - AGENTS.md contains the exact headless validation command placeholders.
  - No product design details are duplicated beyond necessary rules.
  validation:
    level: full
    commands:
    - test -f AGENTS.md
    must_capture_exit_code: true
    must_include_relevant_failure_lines: true
  forbidden:
  - Do not modify files outside allowed_write_files.
  - Do not refactor unrelated code.
  - Do not add packages, addons, autoloads, editor plugins, or generated binaries.
  - Do not invent a new API when required_api_or_shapes specifies one.
  - Do not leave TODO, pass, placeholder returns, or commented-out failed attempts unless explicitly requested.
  - Do not initialize Godot.
  - Do not add CI.
  stop_and_report_if:
  - A required read file is missing.
  - The requested API conflicts with already accepted code.
  - A validation failure is outside the allowed write files.
  - Completion would exceed max_changed_lines by more than 20 percent.
  - Two focused repair attempts fail.
  required_response:
    format: yaml
    fields:
    - task_id
    - status
    - summary
    - files_changed
    - commands_run
    - command_results
    - acceptance_checklist
    - remaining_problem
    status_values:
    - completed
    - blocked
    - failed
    no_markdown_fences: true
  status: pending
