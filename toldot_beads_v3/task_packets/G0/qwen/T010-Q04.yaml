id: T010-Q04
parent_task_id: T010
milestone: M01
title: Run project smoke check
executor_profile: qwen_reviewer
depends_on:
- T010-Q03
risk: low
context_policy:
  max_input_tokens: 12000
  max_files_in_context: 8
  include_git_diff: true
  never_include_entire_repository: true
change_budget:
  allowed_write_files: []
  max_changed_lines: 20
  max_new_dependencies: 0
  max_production_files: 0
read_first:
- AGENTS.md
- docs/architecture.md
- project.godot
- scenes/main.tscn
- src/app/main.gd
- icon.svg
objective: Create the smallest Godot project that opens and exits headlessly without errors.
exact_instructions:
- Do not edit files unless the prior three subtasks produced a parse error.
- Run the project import and one-frame headless launch.
- Report exact command output on failure.
required_api_or_shapes: []
tests_or_checks_to_add:
- Do not add tests unless an allowed test file is listed.
- Do not weaken, delete, skip, or rewrite an existing test to make the task pass.
acceptance_criteria:
- Both commands exit with code 0.
- Godot imports the project without parse errors.
- The main scene runs headlessly and exits when invoked with --quit-after 1.
- No addons or autoloads exist.
validation:
  level: full
  commands:
  - godot --headless --path . --editor --quit
  - godot --headless --path . --quit-after 1
  must_capture_exit_code: true
  must_include_relevant_failure_lines: true
forbidden:
- Do not modify files outside allowed_write_files.
- Do not refactor unrelated code.
- Do not add packages, addons, autoloads, editor plugins, or generated binaries.
- Do not invent a new API when required_api_or_shapes specifies one.
- Do not leave TODO, pass, placeholder returns, or commented-out failed attempts unless explicitly requested.
- Do not build gameplay.
- Do not add UI beyond an empty root.
stop_and_report_if:
- A required read file is missing.
- The requested API conflicts with already accepted code.
- A validation failure is outside the allowed write files.
- Completion would exceed max_changed_lines by more than 20 percent.
- Two focused repair attempts fail.
required_response:
  format: yaml
  fields:
  - task_id
  - status
  - summary
  - files_changed
  - commands_run
  - command_results
  - acceptance_checklist
  - remaining_problem
  status_values:
  - completed
  - blocked
  - failed
  no_markdown_fences: true
