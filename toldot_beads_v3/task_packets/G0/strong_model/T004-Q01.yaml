id: T004-Q01
parent_task_id: T004
milestone: M00
title: Write historical representation guide
executor_profile: human_or_strong
depends_on:
- T001-Q01
risk: low
context_policy:
  max_input_tokens: 12000
  max_files_in_context: 8
  include_git_diff: true
  never_include_entire_repository: true
change_budget:
  allowed_write_files:
  - docs/historical_style.md
  max_changed_lines: 250
  max_new_dependencies: 0
  max_production_files: 1
read_first:
- AGENTS.md
- toldot_project.yaml
objective: Create enforceable language and representation rules for scenario content.
exact_instructions:
- Define how to refer to Ottoman Palestine, the Land of Israel, Yishuv, Old Yishuv, New Yishuv, and aliyah in context.
- Require source notes for named events and people.
- Require uncertainty labels for disputed or approximate material.
- Forbid empty-land framing and generic hostile-native mechanics.
- Require Arab local communities and Ottoman authorities to have concrete interests and choices.
- Require Jewish groups to be internally diverse rather than one unified ideology.
- Define transliteration policy and Hebrew-name display policy.
required_api_or_shapes: []
tests_or_checks_to_add:
- Do not add tests unless an allowed test file is listed.
- Do not weaken, delete, skip, or rewrite an existing test to make the task pass.
acceptance_criteria:
- Guide contains a terminology section.
- Guide contains a representation pitfalls section.
- Guide contains source quality priorities.
- Guide contains examples of acceptable and unacceptable event wording.
validation:
  level: full
  commands:
  - test -f docs/historical_style.md
  must_capture_exit_code: true
  must_include_relevant_failure_lines: true
forbidden:
- Do not modify files outside allowed_write_files.
- Do not refactor unrelated code.
- Do not add packages, addons, autoloads, editor plugins, or generated binaries.
- Do not invent a new API when required_api_or_shapes specifies one.
- Do not leave TODO, pass, placeholder returns, or commented-out failed attempts unless explicitly requested.
- Do not write final event content.
stop_and_report_if:
- A required read file is missing.
- The requested API conflicts with already accepted code.
- A validation failure is outside the allowed write files.
- Completion would exceed max_changed_lines by more than 20 percent.
- Two focused repair attempts fail.
required_response:
  format: yaml
  fields:
  - task_id
  - status
  - summary
  - files_changed
  - commands_run
  - command_results
  - acceptance_checklist
  - remaining_problem
  status_values:
  - completed
  - blocked
  - failed
  no_markdown_fences: true
status: pending
resolved_owner: strong_model
resolved_category: architecture_spec
resolved_owner_detail: strong-model; human approval
human_required: false
placeholder_allowed: false
human_review_required: true
beads:
  id: toldot-t004-q01
  external_ref: T004-Q01
  gate: G0
  labels: []
