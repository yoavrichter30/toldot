id: T003-Q01
parent_task_id: T003
milestone: M00
title: Write simulation rules document
executor_profile: human_or_strong
depends_on:
- T002-Q01
risk: low
context_policy:
  max_input_tokens: 12000
  max_files_in_context: 8
  include_git_diff: true
  never_include_entire_repository: true
change_budget:
  allowed_write_files:
  - docs/simulation_rules.md
  max_changed_lines: 250
  max_new_dependencies: 0
  max_production_files: 1
read_first:
- AGENTS.md
- docs/architecture.md
- toldot_project.yaml
objective: Specify tick order, constrained resources, ID conventions, and deterministic behavior before implementation.
exact_instructions:
- Define the daily clock and weekly/monthly settlement boundaries.
- 'Define fixed tick order: commands, daily movement/project progress, weekly conditions, monthly economy/retention/events,
  victory evaluation.'
- Define valid ranges for public_trust, ottoman_tolerance, health, morale, and retention.
- Define how integer prototype population units are represented.
- Define stable string ID naming rules.
- Define deterministic rounding and random draw order.
required_api_or_shapes: []
tests_or_checks_to_add:
- Do not add tests unless an allowed test file is listed.
- Do not weaken, delete, skip, or rewrite an existing test to make the task pass.
acceptance_criteria:
- Every first-iteration system has an explicit tick frequency.
- Every constrained numeric field has a min/max.
- The document forbids iterating unordered Dictionary keys when random draws depend on order.
validation:
  level: full
  commands:
  - test -f docs/simulation_rules.md
  must_capture_exit_code: true
  must_include_relevant_failure_lines: true
forbidden:
- Do not modify files outside allowed_write_files.
- Do not refactor unrelated code.
- Do not add packages, addons, autoloads, editor plugins, or generated binaries.
- Do not invent a new API when required_api_or_shapes specifies one.
- Do not leave TODO, pass, placeholder returns, or commented-out failed attempts unless explicitly requested.
- Do not choose final balance values.
stop_and_report_if:
- A required read file is missing.
- The requested API conflicts with already accepted code.
- A validation failure is outside the allowed write files.
- Completion would exceed max_changed_lines by more than 20 percent.
- Two focused repair attempts fail.
required_response:
  format: yaml
  fields:
  - task_id
  - status
  - summary
  - files_changed
  - commands_run
  - command_results
  - acceptance_checklist
  - remaining_problem
  status_values:
  - completed
  - blocked
  - failed
  no_markdown_fences: true
status: pending
