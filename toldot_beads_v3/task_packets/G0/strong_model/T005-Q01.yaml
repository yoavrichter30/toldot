id: T005-Q01
parent_task_id: T005
milestone: M00
title: Write content format contract
executor_profile: human_or_strong
depends_on:
- T002-Q01
- T003-Q01
- T004-Q01
risk: low
context_policy:
  max_input_tokens: 12000
  max_files_in_context: 8
  include_git_diff: true
  never_include_entire_repository: true
change_budget:
  allowed_write_files:
  - docs/content_format.md
  max_changed_lines: 250
  max_new_dependencies: 0
  max_production_files: 1
read_first:
- AGENTS.md
- docs/architecture.md
- docs/simulation_rules.md
- docs/historical_style.md
objective: Define JSON file shapes and the registered condition/effect approach.
exact_instructions:
- 'List content file categories: scenario, locations, routes, cohorts, buildings, projects, events, localization,
  source notes.'
- Define required common fields id, display_name_key, schema_version.
- Define condition objects and effect objects as tagged data.
- Forbid arbitrary script paths and expressions.
- Define cross-reference validation rules.
- Define localization key conventions.
required_api_or_shapes: []
tests_or_checks_to_add:
- Do not add tests unless an allowed test file is listed.
- Do not weaken, delete, skip, or rewrite an existing test to make the task pass.
acceptance_criteria:
- The document contains one valid minimal event example.
- The document contains one invalid arbitrary-code example.
- All IDs use lowercase snake_case.
- Source-note linkage is specified.
validation:
  level: full
  commands:
  - test -f docs/content_format.md
  must_capture_exit_code: true
  must_include_relevant_failure_lines: true
forbidden:
- Do not modify files outside allowed_write_files.
- Do not refactor unrelated code.
- Do not add packages, addons, autoloads, editor plugins, or generated binaries.
- Do not invent a new API when required_api_or_shapes specifies one.
- Do not leave TODO, pass, placeholder returns, or commented-out failed attempts unless explicitly requested.
- Do not create schemas yet.
stop_and_report_if:
- A required read file is missing.
- The requested API conflicts with already accepted code.
- A validation failure is outside the allowed write files.
- Completion would exceed max_changed_lines by more than 20 percent.
- Two focused repair attempts fail.
required_response:
  format: yaml
  fields:
  - task_id
  - status
  - summary
  - files_changed
  - commands_run
  - command_results
  - acceptance_checklist
  - remaining_problem
  status_values:
  - completed
  - blocked
  - failed
  no_markdown_fences: true
status: pending
resolved_owner: strong_model
resolved_category: architecture_spec
resolved_owner_detail: strong-model; human approval
human_required: false
placeholder_allowed: false
human_review_required: true
beads:
  id: toldot-t005-q01
  external_ref: T005-Q01
  gate: G0
  labels: []
