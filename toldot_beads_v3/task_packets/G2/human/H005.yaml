id: H005
milestone: M06
title: Create ten building and project icons
executor_profile: human_visual
depends_on:
- H001
- T055-Q05
risk: low
objective: Create a compact icon set for the ten first-iteration improvements.
exact_instructions:
- Create icons matching the ten building IDs in buildings.json.
- Use period-neutral shapes and avoid anachronistic machinery.
- Deliver SVG masters and 64 px PNG previews.
- Use filenames exactly matching building IDs.
acceptance_criteria:
- Every building ID has exactly one SVG and one PNG.
- Filenames match content IDs.
- Icons are distinct at 20 px.
- No icon adds unsupported historical claims.
change_budget:
  allowed_write_files:
  - assets/ui/buildings/
  max_changed_lines: 0
  max_new_dependencies: 0
  max_production_files: 20
read_first:
- docs/visual_direction.md
- content/scenarios/yishuv_1904/buildings.json
validation:
  level: manual
  commands:
  - find assets/ui/buildings -type f | sort
  must_capture_exit_code: true
  must_include_relevant_failure_lines: true
forbidden:
- Do not rename building IDs.
stop_and_report_if:
- A building definition is still changing.
required_response:
  format: yaml
  fields:
  - task_id
  - status
  - summary
  - files_changed
  - acceptance_checklist
  status_values:
  - completed
  - blocked
  - failed
  no_markdown_fences: true
status: pending
human_required: false
human_category: asset_generation
placeholder_allowed: true
resolved_owner: human
resolved_category: asset_generation
resolved_owner_detail: human_visual
