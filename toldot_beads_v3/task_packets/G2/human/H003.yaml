id: H003
milestone: M05
title: Create five location-type icons
executor_profile: human_visual
depends_on:
- H001
risk: low
objective: Create a readable icon set for location types used on the strategic map.
exact_instructions:
- Create icons for old_yishuv_city, port_city, moshava, training_farm, and regional_town.
- Use one consistent outline weight and a transparent background.
- Deliver SVG masters and 64 px PNG previews.
- Verify each icon remains distinguishable at 20 px.
- Use original geometry; do not trace copyrighted game icons.
acceptance_criteria:
- Five SVG files and five 64 px PNG previews exist.
- Icons are visually distinct at 20 px.
- All SVGs have consistent viewBox dimensions.
- No embedded raster images or external links exist.
change_budget:
  allowed_write_files:
