id: H002
milestone: M04
title: Select licensed bilingual fonts
executor_profile: human_visual
depends_on:
- H001
risk: medium
objective: Select fonts that render Hebrew and English clearly and can legally ship with the game.
exact_instructions:
- Test at least two candidate font families with Hebrew and Latin coverage.
- Verify license permits game redistribution and embedding.
- Test body text at 14, 16, and 18 px and headings at 24 and 32 px.
- Record exact font family, weights, source, license, and fallback order.
- Do not commit font binaries in this planning bundle.
acceptance_criteria:
- Primary and fallback fonts are named.
- Hebrew niqqud, punctuation, numbers, and mixed Hebrew/English strings render acceptably.
- License source and redistribution status are recorded.
- A fallback is documented if the primary font cannot be bundled.
change_budget:
  allowed_write_files:
  - docs/font_decision.md
  max_changed_lines: 160
  max_new_dependencies: 0
  max_production_files: 1
read_first:
- docs/visual_direction.md
validation:
  level: manual
  commands:
  - test -f docs/font_decision.md
  must_capture_exit_code: true
  must_include_relevant_failure_lines: true
forbidden:
- Do not share or redistribute font files in task reports.
stop_and_report_if:
- No candidate license clearly permits redistribution.
required_response:
  format: yaml
  fields:
  - task_id
  - status
  - summary
  - files_changed
  - acceptance_checklist
  status_values:
  - completed
  - blocked
  - failed
  no_markdown_fences: true
status: pending
human_required: true
human_category: font_license
placeholder_allowed: true
resolved_owner: human
resolved_category: font_license
resolved_owner_detail: human_visual
beads:
  id: toldot-h002
  external_ref: H002
  gate: G2
  labels: []
