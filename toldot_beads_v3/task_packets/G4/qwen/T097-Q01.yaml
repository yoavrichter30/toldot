risk: low
context_policy:
  max_input_tokens: 12000
  max_files_in_context: 8
  include_git_diff: true
  never_include_entire_repository: true
change_budget:
  allowed_write_files:
  - content/scenarios/yishuv_1904/tutorial.json
  - content/localization/en.json
  - content/localization/he.json
  max_changed_lines: 180
  max_new_dependencies: 0
  max_production_files: 3
read_first:
- AGENTS.md
- docs/architecture.md
- docs/simulation_rules.md
- docs/content_format.md
- docs/historical_style.md
objective: Guide a first player through the core loop using short contextual objectives.
exact_instructions:
- 'Create steps: inspect location, resume time, receive cohort, inspect needs, assign cohort, start housing/water
  project, inspect foundation tracks, resolve one event, inspect Ahuzat Bayit prerequisites.'
- Trigger steps from state conditions rather than fixed timers.
- Allow tutorial dismissal.
- Add English and Hebrew localization.
required_api_or_shapes: []
tests_or_checks_to_add:
- Do not add tests unless an allowed test file is listed.
- Do not weaken, delete, skip, or rewrite an existing test to make the task pass.
acceptance_criteria:
- Every step can be completed in the starting scenario.
- Dismissal persists in the current run.
- Tutorial never blocks event choices.
- Text does not claim the player represents a historical government.
validation:
  level: full
  commands:
  - python -m json.tool content/scenarios/yishuv_1904/tutorial.json >/dev/null
  - godot --headless --path . --script res://tools/test_runner.gd
  must_capture_exit_code: true
  must_include_relevant_failure_lines: true
forbidden:
- Do not modify files outside allowed_write_files.
- Do not refactor unrelated code.
- Do not add packages, addons, autoloads, editor plugins, or generated binaries.
- Do not invent a new API when required_api_or_shapes specifies one.
- Do not leave TODO, pass, placeholder returns, or commented-out failed attempts unless explicitly requested.
- Do not create a separate tutorial scenario.
stop_and_report_if:
- A required read file is missing.
- The requested API conflicts with already accepted code.
- A validation failure is outside the allowed write files.
- Completion would exceed max_changed_lines by more than 20 percent.
- Two focused repair attempts fail.
required_response:
  format: yaml
  fields:
  - task_id
  - status
  - summary
  - files_changed
  - commands_run
  - command_results
  - acceptance_checklist
  - remaining_problem
  status_values:
  - completed
  - blocked
  - failed
  no_markdown_fences: true
