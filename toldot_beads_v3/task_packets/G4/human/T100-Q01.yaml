id: T100-Q01
parent_task_id: T100
milestone: M08
title: Run final vertical-slice acceptance
executor_profile: human_or_strong
depends_on:
- T091-Q02
- T093-Q02
- T094-Q02
- T096-Q01
- T098-Q02
- T099-Q02
risk: medium
context_policy:
  max_input_tokens: 12000
  max_files_in_context: 8
  include_git_diff: true
  never_include_entire_repository: true
change_budget:
  allowed_write_files:
  - ops/reviews/vertical_slice_acceptance.md
  max_changed_lines: 400
  max_new_dependencies: 0
  max_production_files: 1
read_first:
- AGENTS.md
- docs/architecture.md
- docs/content_format.md
- docs/historical_style.md
objective: Verify the complete first iteration against the project definition of done.
exact_instructions:
- Run project parse, full tests, deterministic replay, and soak runner.
- Start the game and complete the tutorial checklist.
- Verify one cohort assignment, one project, one donor or permit decision, one event, save/load, and campaign outcome.
- Check that all changed files are committed and no TODO placeholders remain in player-facing text.
- Record every definition-of-done item as pass or fail.
required_api_or_shapes: []
tests_or_checks_to_add:
- Do not add tests unless an allowed test file is listed.
- Do not weaken, delete, skip, or rewrite an existing test to make the task pass.
acceptance_criteria:
- Acceptance report lists all definition-of-done items.
- Every failed item includes exact reproduction steps.
- Task is accepted only when all blocking items pass.
validation:
  level: full
  commands:
  - godot --headless --path . --editor --quit
  - godot --headless --path . --script res://tools/test_runner.gd
  - godot --headless --path . --script res://tools/run_campaign_soak.gd -- --seed=190401
  must_capture_exit_code: true
  must_include_relevant_failure_lines: true
forbidden:
- Do not modify files outside allowed_write_files.
- Do not refactor unrelated code.
- Do not add packages, addons, autoloads, editor plugins, or generated binaries.
- Do not invent a new API when required_api_or_shapes specifies one.
- Do not leave TODO, pass, placeholder returns, or commented-out failed attempts unless explicitly requested.
- Do not fix defects during review.
stop_and_report_if:
- A required read file is missing.
- The requested API conflicts with already accepted code.
- A validation failure is outside the allowed write files.
- Completion would exceed max_changed_lines by more than 20 percent.
- Two focused repair attempts fail.
required_response:
  format: yaml
  fields:
  - task_id
  - status
  - summary
  - files_changed
  - commands_run
  - command_results
  - acceptance_checklist
  - remaining_problem
  status_values:
  - completed
  - blocked
  - failed
  no_markdown_fences: true
status: pending
resolved_owner: human
resolved_category: final_acceptance
resolved_owner_detail: human
human_required: true
placeholder_allowed: false
human_category: final_acceptance
beads:
  id: toldot-t100-q01
  external_ref: T100-Q01
  gate: G4
  labels: []
