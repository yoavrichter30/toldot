id: T099-Q01
parent_task_id: T099
milestone: M08
title: Create three scripted balance policies and measurement report
executor_profile: human_or_strong
depends_on:
- T088-Q12
- T095-Q03
- T096-Q01
risk: low
context_policy:
  max_input_tokens: 12000
  max_files_in_context: 8
  include_git_diff: true
  never_include_entire_repository: true
change_budget:
  allowed_write_files:
  - docs/balance_notes.md
  max_changed_lines: 220
  max_new_dependencies: 0
  max_production_files: 1
read_first:
- AGENTS.md
- docs/architecture.md
- docs/simulation_rules.md
- docs/content_format.md
- docs/historical_style.md
- content/scenarios/yishuv_1904/scenario.json
- content/scenarios/yishuv_1904/buildings.json
- content/scenarios/yishuv_1904/arrival_schedule.json
objective: Adjust only numeric prototype values so three documented play styles remain viable.
exact_instructions:
- Define settlement-first, institution-first, and donor-assisted policies in precise pseudocode.
- Define metrics and ten fixed seeds.
- Do not change balance values yet.
required_api_or_shapes: []
tests_or_checks_to_add:
- Do not add tests unless an allowed test file is listed.
- Do not weaken, delete, skip, or rewrite an existing test to make the task pass.
acceptance_criteria:
- Policies are deterministic and use visible state only.
validation:
  level: full
  commands:
  - godot --headless --path . --script res://tools/test_runner.gd
  - godot --headless --path . --script res://tools/run_campaign_soak.gd -- --seed=190401
  must_capture_exit_code: true
  must_include_relevant_failure_lines: true
forbidden:
- Do not modify files outside allowed_write_files.
- Do not refactor unrelated code.
- Do not add packages, addons, autoloads, editor plugins, or generated binaries.
- Do not invent a new API when required_api_or_shapes specifies one.
- Do not leave TODO, pass, placeholder returns, or commented-out failed attempts unless explicitly requested.
- Do not add mechanics.
- Do not rewrite event prose.
stop_and_report_if:
- A required read file is missing.
- The requested API conflicts with already accepted code.
- A validation failure is outside the allowed write files.
- Completion would exceed max_changed_lines by more than 20 percent.
- Two focused repair attempts fail.
required_response:
  format: yaml
  fields:
  - task_id
  - status
  - summary
  - files_changed
  - commands_run
  - command_results
  - acceptance_checklist
  - remaining_problem
  status_values:
  - completed
  - blocked
  - failed
  no_markdown_fences: true
status: pending
resolved_owner: human
resolved_category: playtest_analysis
resolved_owner_detail: human with optional strong-model assistance
human_required: true
placeholder_allowed: false
human_category: playtest_analysis
